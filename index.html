<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Smart Digital Lock Simulator - Khóa Điện Tử Thông Minh</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- 3D WebGL Canvas Viewport -->
    <div id="viewport-3d"></div>

    <!-- Right Dock: Minimalist Keypad Interface -->
    <aside class="right-dock">
        <!-- Virtual Keypad for PIN Code Entry -->
        <div class="keypad-section">
            <div id="pin-display" class="pin-screen">_ _ _ _</div>
            <div class="virtual-keypad">
                <button class="vk-btn" data-key="1">1</button>
                <button class="vk-btn" data-key="2">2</button>
                <button class="vk-btn" data-key="3">3</button>
                <button class="vk-btn" data-key="4">4</button>
                <button class="vk-btn" data-key="5">5</button>
                <button class="vk-btn" data-key="6">6</button>
                <button class="vk-btn" data-key="7">7</button>
                <button class="vk-btn" data-key="8">8</button>
                <button class="vk-btn" data-key="9">9</button>
                <button class="vk-btn special" data-key="*">*</button>
                <button class="vk-btn" data-key="0">0</button>
                <button class="vk-btn special confirm" data-key="#">#</button>
            </div>
        </div>

        <!-- Quick Manual Lock Button -->
        <div style="margin-top: 12px;">
            <button id="btn-manual-lock" class="sim-btn" style="width: 100%; padding: 11px; border-radius: 10px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Khóa Cửa
            </button>
        </div>
    </aside>

    <!-- Bottom Camera Angle Switcher (Focused on Keypad & Full Door) -->
    <nav class="bottom-camera-bar">
        <button class="cam-btn active" data-preset="keypad">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="m4.93 4.93 4.24 4.24"></path></svg>
            Bàn Phím & Màn Hình 3D
        </button>
        <button class="cam-btn" data-preset="full">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            Toàn Cảnh Cánh Cửa
        </button>
    </nav>

    <!-- App Scripts -->
    <script src="audio.js"></script>
    <script src="lock3d.js"></script>
    <script src="app.js"></script>
</body>
</html>
